name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка проекта Capacitor
        run: |
          mkdir -p www
          test -f index.html || { echo "Нет файла index.html в корне репозитория"; exit 1; }
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "ei25-schedule",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/local-notifications": "^6.0.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ei25.schedule",
            "appName": "Расписание ЭИ-25",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon",
                "iconColor": "#2F80ED"
              }
            }
          }
          EOF
          npm install --no-audit --no-fund
          npx cap add android

      - name: Разрешения, иконка, номер версии
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import os, re
          man = "android/app/src/main/AndroidManifest.xml"
          s = open(man, encoding="utf-8").read()
          perms = ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "RECEIVE_BOOT_COMPLETED", "VIBRATE", "WAKE_LOCK"]
          add = "".join('    <uses-permission android:name="android.permission.%s" />\n' % p for p in perms)
          assert "</manifest>" in s
          s = s.replace("</manifest>", add + "</manifest>")
          open(man, "w", encoding="utf-8").write(s)

          # Use the actual EI-25 artwork committed with the web app, not the old placeholder vector.
          from pathlib import Path
          import shutil
          from PIL import Image
          res = Path("android/app/src/main/res")
          source = Path("icons/icon-512.png")
          if not source.exists():
              raise SystemExit("Missing icons/icon-512.png")
          # Preserve the full original artwork. Remove only near-white pixels connected to the image border,
          # so white calendar pages, lettering highlights and clock face stay opaque.
          im = Image.open(source).convert("RGBA")
          w, h = im.size
          pix = im.load()
          from collections import deque
          q = deque()
          seen = bytearray(w * h)
          def is_outer_bg(x, y):
              r, g, b, a = pix[x, y]
              return r >= 235 and g >= 235 and b >= 235 and a > 0
          def seed(x, y):
              i = y * w + x
              if not seen[i] and is_outer_bg(x, y):
                  seen[i] = 1
                  q.append((x, y))
          for x in range(w):
              seed(x, 0)
              seed(x, h - 1)
          for y in range(h):
              seed(0, y)
              seed(w - 1, y)
          while q:
              x, y = q.popleft()
              r, g, b, a = pix[x, y]
              pix[x, y] = (r, g, b, 0)
              for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                  if 0 <= nx < w and 0 <= ny < h:
                      seed(nx, ny)
          transparent_count = sum(1 for y in range(h) for x in range(w) if pix[x, y][3] == 0)
          print(f"Transparent outer background pixels: {transparent_count}")
          # Crop away transparent margins left by the white-background removal.
          # Otherwise Android scales the whole 512x512 canvas and the visible logo looks tiny.
          bbox = im.getchannel("A").getbbox()
          if not bbox:
              raise SystemExit("Icon became fully transparent")
          im = im.crop(bbox)
          # The source artwork is square; resize the visible artwork to the full launcher canvas.
          im = im.resize((512, 512), Image.Resampling.LANCZOS)
          source = Path("launcher-transparent.png")
          im.save(source)

          # Use correctly sized launcher bitmaps for each Android density.
          # The visible artwork fills the available canvas instead of retaining outer whitespace.
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          shutil.rmtree(res / "mipmap-anydpi-v26", ignore_errors=True)
          for density, size in sizes.items():
              target = res / ("mipmap-" + density)
              target.mkdir(parents=True, exist_ok=True)
              icon = im.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon.save(target / name, optimize=True)
          g = "android/app/build.gradle"
          t = open(g, encoding="utf-8").read()
          t, n = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ.get("RUN_NUMBER", "1"), t, count=1)
          open(g, "w", encoding="utf-8").write(t)
          print("versionCode patched:", n)
          PY

      - name: Постоянный ключ подписи (чтобы обновления ставились поверх)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Файл в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Raspisanie-EI-25-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Файл в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Raspisanie-EI-25.apk
          gh release create "build-${{ github.run_number }}" Raspisanie-EI-25.apk --title "Сборка ${{ github.run_number }}" --notes "Установочный файл расписания ЭИ-25" --target "${{ github.sha }}"
