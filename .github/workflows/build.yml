name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Подготовка проекта Capacitor
        run: |
          mkdir -p www
          test -f index.html || { echo "Нет файла index.html в корне репозитория"; exit 1; }
          cp index.html www/index.html
          cat > package.json <<'EOF'
          {
            "name": "ei25-schedule",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/core": "^6.0.0",
              "@capacitor/android": "^6.0.0",
              "@capacitor/local-notifications": "^6.0.0",
              "@capacitor/filesystem": "^6.0.0",
              "@capacitor/share": "^6.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^6.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.ei25.schedule",
            "appName": "Расписание ЭИ-25",
            "webDir": "www",
            "plugins": {
              "LocalNotifications": {
                "smallIcon": "ic_stat_icon",
                "iconColor": "#2F80ED"
              }
            }
          }
          EOF
          npm install --no-audit --no-fund
          npx cap add android

      - name: Постоянное уведомление о текущей паре
        run: |
          mkdir -p android/app/src/main/java/com/ei25/schedule
          cat > android/app/src/main/java/com/ei25/schedule/ClassStatusPlugin.java <<'EOF'
          package com.ei25.schedule;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.content.Context;
          import android.graphics.Color;
          import android.os.Build;
          import androidx.core.app.NotificationCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ClassStatus")
          public class ClassStatusPlugin extends Plugin {
              private static final int NOTIFICATION_ID = 2525;
              private static final String CHANNEL_ID = "class_live_v4";

              @PluginMethod
              public void update(PluginCall call) {
                  Context context = getContext();
                  NotificationManager manager = (NotificationManager) context.getSystemService(Context.NOTIFICATION_SERVICE);
                  boolean active = call.getBoolean("active", false);
                  if (!active) {
                      manager.cancel(NOTIFICATION_ID);
                      call.resolve();
                      return;
                  }
                  String title = call.getString("title", "Сейчас идёт пара");
                  String body = call.getString("body", "");
                  long nextAt = call.getLong("nextAt", 0L);
                  int progress = Math.max(0, Math.min(100, call.getInt("progress", 0)));
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(CHANNEL_ID, "Текущая пара", NotificationManager.IMPORTANCE_MAX);
                      channel.setDescription("Информация о паре, которая идёт сейчас");
                      manager.createNotificationChannel(channel);
                  }
                  Notification notification = new NotificationCompat.Builder(context, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_my_calendar)
                      .setContentTitle(title)
                      .setContentText(body.replace("\n", " · "))
                      .setColor(Color.rgb(34, 197, 94))
                      .setColorized(true)
                      .setProgress(100, progress, false)
                      .setCategory(NotificationCompat.CATEGORY_STATUS)
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setVisibility(NotificationCompat.VISIBILITY_PUBLIC)
                      .setOngoing(true)
                      .setOnlyAlertOnce(true)
                      .setShowWhen(nextAt > 0)
                      .setUsesChronometer(nextAt > 0)
                      .setChronometerCountDown(true)
                      .setWhen(nextAt > 0 ? nextAt : System.currentTimeMillis())
                      .setForegroundServiceBehavior(NotificationCompat.FOREGROUND_SERVICE_IMMEDIATE)
                      .build();
                  manager.notify(NOTIFICATION_ID, notification);
                  call.resolve();
              }
          }
          EOF
          cat > android/app/src/main/java/com/ei25/schedule/MainActivity.java <<'EOF'
          package com.ei25.schedule;

          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(ClassStatusPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          EOF

      - name: Разрешения, иконка, номер версии
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 -m pip install --quiet pillow cairosvg
          python3 - <<'PY'
          import os, re
          man = "android/app/src/main/AndroidManifest.xml"
          s = open(man, encoding="utf-8").read()
          perms = ["POST_NOTIFICATIONS", "SCHEDULE_EXACT_ALARM", "USE_EXACT_ALARM", "RECEIVE_BOOT_COMPLETED", "VIBRATE", "WAKE_LOCK"]
          add = "".join('    <uses-permission android:name="android.permission.%s" />\n' % p for p in perms)
          assert "</manifest>" in s
          s = s.replace("</manifest>", add + "</manifest>")
          open(man, "w", encoding="utf-8").write(s)

          # Render the circular EI-25 artwork from the SVG source.
          # The SVG already contains the transparent outside corners; do not add another circle behind it.
          from pathlib import Path
          import shutil
          import cairosvg
          from PIL import Image
          res = Path("android/app/src/main/res")
          source_svg = Path("icons/icon-round.svg")
          if not source_svg.exists():
              raise SystemExit("Missing icons/icon-round.svg")
          source = Path("launcher-circular.png")
          cairosvg.svg2png(url=str(source_svg), write_to=str(source), output_width=512, output_height=512)
          im = Image.open(source).convert("RGBA")
          if im.size != (512, 512):
              raise SystemExit("Generated launcher icon has unexpected dimensions")
          if im.getpixel((0, 0))[3] != 0:
              raise SystemExit("Launcher icon must have transparent corners")

          # Use correctly sized launcher bitmaps for each Android density.
          # The visible artwork fills the available canvas instead of retaining outer whitespace.
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          shutil.rmtree(res / "mipmap-anydpi-v26", ignore_errors=True)
          for density, size in sizes.items():
              target = res / ("mipmap-" + density)
              target.mkdir(parents=True, exist_ok=True)
              icon = im.resize((size, size), Image.Resampling.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon.save(target / name, optimize=True)
          g = "android/app/build.gradle"
          t = open(g, encoding="utf-8").read()
          t, n = re.subn(r"versionCode\s+\d+", "versionCode " + os.environ.get("RUN_NUMBER", "1"), t, count=1)
          open(g, "w", encoding="utf-8").write(t)
          print("versionCode patched:", n)
          PY

      - name: Постоянный ключ подписи (чтобы обновления ставились поверх)
        run: |
          mkdir -p ~/.android
          echo "" | base64 -d > ~/.android/debug.keystore

      - name: Синхронизация
        run: npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Файл в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: Raspisanie-EI-25-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Файл в релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Raspisanie-EI-25.apk
          gh release create "build-${{ github.run_number }}" Raspisanie-EI-25.apk --title "Сборка ${{ github.run_number }}" --notes "Установочный файл расписания ЭИ-25" --target "${{ github.sha }}"
